<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zucker Editor</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="wizard">
      <section class="step active" id="step1">
        <div class="step-header">
          <span>Paso 1 de 3</span>
          <h1>Zucker Editor</h1>
        </div>
        <label class="name-field">
          Nombre del vídeo
          <input id="videoName" />
        </label>
        <div id="dropZone" class="drop-zone">
          <div class="drop-copy">
            <strong>Arrastra aquí tus archivos</strong>
            <span>Vídeos, el audio master y (si lo tienes) el songs.json del Zucker Mixer</span>
          </div>
          <div id="chips" class="chips"></div>
        </div>
        <p id="softRule" class="soft-rule">Falta el audio master</p>
        <button id="confirmFiles" class="primary" disabled>Confirmar y seguir →</button>
      </section>

      <section class="step" id="step2">
        <div class="step-header">
          <span>Paso 2 de 3</span>
          <h1>Elige el tipo de edición</h1>
        </div>
        <div class="platforms">
          <button class="platform-card" data-platform="youtube">
            <strong>YouTube</strong>
            <span>Edición completa de la canción</span>
          </button>
          <button class="platform-card" data-platform="instagram">
            <strong>Instagram</strong>
            <span>Vídeo corto formato Instagram</span>
          </button>
          <button class="platform-card" data-platform="tiktok">
            <strong>TikTok</strong>
            <span>Aún más corto y dinámico</span>
          </button>
        </div>
        <div id="songPicker" class="song-picker" hidden>
          <h2>¿Qué canción?</h2>
          <div id="songOptions"></div>
        </div>
        <button id="startWizard" class="primary" disabled>¡Hazlo! →</button>
      </section>

      <section class="step" id="step3">
        <div class="step-header">
          <span>Paso 3 de 3</span>
          <h1 id="progressTitle">Creando tu vídeo</h1>
        </div>
        <div id="progressBox" class="progress-box">
          <div class="progress-track"><div id="progressBar"></div></div>
          <strong id="progressMessage">Preparando...</strong>
          <span id="progressDetail"></span>
        </div>
        <div id="errorBox" class="error-box" hidden>
          <p id="errorText"></p>
          <details>
            <summary>Ver detalles técnicos</summary>
            <pre id="technicalDetails"></pre>
          </details>
          <button id="retryWizard">Reintentar</button>
        </div>
        <div id="resultBox" class="result-box" hidden>
          <video id="resultVideo" controls></video>
          <strong id="resultFilename"></strong>
          <div class="result-actions">
            <button id="showFinder">Mostrar en Finder</button>
            <button id="again">Hacer otro</button>
          </div>
        </div>
      </section>
    </main>
    <div id="toast" class="toast" hidden></div>
    <script src="/app.js"></script>
  </body>
</html>
