name: Tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    name: Fast tests (required)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run all fast tests
        run: python -m pytest -q -m "not slow" --junitxml=fast-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-test-results
          path: fast-results.xml
          if-no-files-found: ignore
  slow:
    name: Slow tests (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run all slow tests
        run: python -m pytest -q -m slow --junitxml=slow-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slow-test-results
          path: slow-results.xml
          if-no-files-found: ignore
