name: Application journey audit
on:
  workflow_dispatch:
  push:
    branches: ['codex/crossplatform-ui-audit']
permissions:
  contents: read
jobs:
  journeys:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install media tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install media tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
          $bin = (Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg*' -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          Add-Content $env:GITHUB_PATH $bin
      - name: Install app and browser
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install chromium
      - name: Test updated scoring, damaged media and UI contracts
        run: python -m pytest -q tests/test_shot_quality_speed.py tests/test_media_integrity.py tests/test_new_project_preview.py --junitxml=qa-results/regressions.xml
      - name: Exercise all five modes through the UI
        env:
          PYTHONUNBUFFERED: '1'
        run: python tools/qa/application_journeys.py --output qa-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-audit-${{ matrix.os }}
          path: qa-results
          retention-days: 7
